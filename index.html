<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKTM | Premium Collection</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v3.4.1 -->
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0a0a0a',
                        accent: {
                            DEFAULT: '#e11d48',
                            hover: '#be123c',
                            light: '#fb7185'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-scale': 'fadeInScale 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeInScale: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React, ReactDOM, Babel, Framer Motion, Lucide -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-brand text-white antialiased;
            }
            ::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit-scrollbar-track {
                @apply bg-brand;
            }
            ::-webkit-scrollbar-thumb {
                @apply bg-zinc-800 rounded-full hover:bg-zinc-700 transition-colors;
            }
        }

        .animate-in {
            @apply animate-fade-in-scale;
        }

        /* Glassmorphism effects */
        .glass {
            @apply bg-zinc-900/80 backdrop-blur-md border border-white/10;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Application Script -->
    <script type="text/babel" src="App.jsx"></script>

    <!-- Lucide Initialization Helper -->
    <script>
        // Global helper for React to trigger icon replacement
        window.refreshIcons = () => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        };
    </script>
</body>
</html>
