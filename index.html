<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKTM - Toko Koleksi Terlengkap</title>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-[#0a0a0a] text-white font-['Inter'] selection:bg-[#e11d48] selection:text-white;
            }
            ::-webkit-scrollbar {
                width: 6px;
            }
            ::-webkit-scrollbar-track {
                background: #0a0a0a;
            }
            ::-webkit-scrollbar-thumb {
                background: #262626;
                border-radius: 10px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #e11d48;
            }
        }
        @layer utilities {
            .animate-slide-left {
                animation: slide-left 0.3s ease-out forwards;
            }
            .animate-slide-right {
                animation: slide-right 0.3s ease-out forwards;
            }
            @keyframes slide-left {
                from { transform: translateX(100%); }
                to { transform: translateX(0); }
            }
            @keyframes slide-right {
                from { transform: translateX(-100%); }
                to { transform: translateX(0); }
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0a0a0a',
                        accent: '#e11d48',
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script>
        const h = React.createElement;
        const { useState, useEffect, useMemo } = React;

        const CONFIG = {
            BRAND_NAME: 'TKTM',
            WHATSAPP_NUMBER: '6288973262022',
            CURRENCY: 'IDR'
        };

        const PRODUCTS = [
            {
                id: 1,
                name: "Cyberpunk Oni Mask",
                price: 1250000,
                category: "Accessories",
                image: "https://images.unsplash.com/photo-1590483734724-383b853b2785?auto=format&fit=crop&q=80&w=800",
                description: "Masker Oni dengan sentuhan futuristik cyberpunk. Terbuat dari material resin berkualitas tinggi dengan detail cat tangan.",
                images: [
                    "https://images.unsplash.com/photo-1590483734724-383b853b2785?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1605810230434-7631ac76ec81?auto=format&fit=crop&q=80&w=800"
                ]
            },
            {
                id: 2,
                name: "Neo-Tokyo Techwear Jacket",
                price: 2450000,
                category: "Apparel",
                image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&q=80&w=800",
                description: "Jaket techwear tahan air dengan banyak kantong fungsional dan aksen neon.",
                images: [
                    "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=800"
                ]
            },
            {
                id: 3,
                name: "Vagabond Katana Display",
                price: 3750000,
                category: "Collectibles",
                image: "https://images.unsplash.com/photo-1530325553241-4f6e7690cf36?auto=format&fit=crop&q=80&w=800",
                description: "Replika katana dengan detail tinggi, terinspirasi dari gaya samurai klasik. Hanya untuk pajangan.",
                images: [
                    "https://images.unsplash.com/photo-1530325553241-4f6e7690cf36?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1589710751893-f9a6770ad71b?auto=format&fit=crop&q=80&w=800"
                ]
            },
            {
                id: 4,
                name: "Akira Inspired Hoodie",
                price: 850000,
                category: "Apparel",
                image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&q=80&w=800",
                description: "Hoodie katun berat dengan grafis ikonik yang terinspirasi dari mahakarya Akira.",
                images: [
                    "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1509967419530-da38b4704bc6?auto=format&fit=crop&q=80&w=800"
                ]
            },
            {
                id: 5,
                name: "Glitch Art Print",
                price: 450000,
                category: "Art",
                image: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&q=80&w=800",
                description: "Poster seni glitch terbatas. Dicetak pada kertas arsip berkualitas tinggi.",
                images: [
                    "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1561070791-2526d30994b5?auto=format&fit=crop&q=80&w=800"
                ]
            },
            {
                id: 6,
                name: "Synthwave Vinyl Record",
                price: 650000,
                category: "Collectibles",
                image: "https://images.unsplash.com/photo-1603048588665-791ca8aea617?auto=format&fit=crop&q=80&w=800",
                description: "Piringan hitam kompilasi synthwave terbaik dengan cover art yang memukau.",
                images: [
                    "https://images.unsplash.com/photo-1603048588665-791ca8aea617?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&q=80&w=800"
                ]
            }
        ];

        const formatIDR = (amount) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(amount);
        };

        const LucideIcon = ({ name, className = "" }) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    if (window.lucide) {
                        window.lucide.createIcons({
                            nameAttr: 'data-lucide'
                        });
                    }
                }, 0);
                return () => clearTimeout(timer);
            }, [name]);

            return h('i', {
                'data-lucide': name,
                className: `w-5 h-5 ${className}`
            });
        };

        const Toast = ({ message, type = 'success', onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return h('div', {
                className: `fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 animate-bounce bg-white text-[#0a0a0a] font-bold border-2 border-accent`
            }, [
                h(LucideIcon, { name: type === 'success' ? 'check-circle' : 'info' }),
                h('span', null, message)
            ]);
        };

        const App = () => {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isMobileNavOpen, setIsMobileNavOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState("");
            const [selectedCategory, setSelectedCategory] = useState("Semua");
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [toast, setToast] = useState(null);

            const categories = ["Semua", ...new Set(PRODUCTS.map(p => p.category))];

            const filteredProducts = useMemo(() => {
                return PRODUCTS.filter(p => {
                    const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesCategory = selectedCategory === "Semua" || p.category === selectedCategory;
                    return matchesSearch && matchesCategory;
                });
            }, [searchQuery, selectedCategory]);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
                setToast(`${product.name} ditambahkan ke keranjang`);
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

            const handleCheckout = () => {
                if (cart.length === 0) return;

                let message = `Halo TKTM, saya ingin memesan:\n\n`;
                cart.forEach(item => {
                    message += `- ${item.name} (x${item.quantity}) - ${formatIDR(item.price * item.quantity)}\n`;
                });
                message += `\nTotal: ${formatIDR(cartTotal)}`;

                const url = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');

                setCart([]);
                setIsCartOpen(false);
                setToast("Pesanan dikirim! Mengalihkan ke WhatsApp...");
            };

            const handleBuyNow = (product) => {
                const message = `Halo TKTM, saya ingin membeli langsung:\n- ${product.name} - ${formatIDR(product.price)}`;
                const url = `https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
                window.open(url, '_blank');
            };

            return h('div', { className: 'min-h-screen' }, [
                // Navbar
                h('nav', { className: 'fixed top-0 w-full z-50 bg-brand/80 backdrop-blur-md border-b border-white/10' }, [
                    h('div', { className: 'max-w-7xl mx-auto px-4 h-16 flex items-center justify-between' }, [
                        h('div', { className: 'flex items-center gap-4' }, [
                            h('button', {
                                className: 'sm:hidden p-2 hover:bg-white/10 rounded-full',
                                onClick: () => setIsMobileNavOpen(true),
                                'aria-label': 'Buka Menu'
                            }, [h(LucideIcon, { name: 'menu' })]),
                            h('h1', { className: 'text-2xl font-black tracking-tighter text-accent' }, CONFIG.BRAND_NAME)
                        ]),
                        h('div', { className: 'hidden sm:flex items-center gap-8' },
                            categories.map(cat => h('button', {
                                key: cat,
                                onClick: () => setSelectedCategory(cat),
                                className: `text-sm font-semibold transition-colors ${selectedCategory === cat ? 'text-accent' : 'text-white/60 hover:text-white'}`
                            }, cat))
                        ),
                        h('div', { className: 'flex items-center gap-2' }, [
                            h('div', { className: 'relative hidden md:block' }, [
                                h('input', {
                                    type: 'text',
                                    placeholder: 'Cari koleksi...',
                                    className: 'bg-white/5 border border-white/10 rounded-full py-1.5 pl-10 pr-4 text-sm focus:outline-none focus:border-accent w-48 transition-all focus:w-64',
                                    value: searchQuery,
                                    onChange: (e) => setSearchQuery(e.target.value)
                                }),
                                h('div', { className: 'absolute left-3 top-1/2 -translate-y-1/2 text-white/40' }, [
                                    h(LucideIcon, { name: 'search', className: 'w-4 h-4' })
                                ])
                            ]),
                            h('button', {
                                className: 'relative p-2 hover:bg-white/10 rounded-full transition-colors',
                                onClick: () => setIsCartOpen(true),
                                'aria-label': 'Keranjang'
                            }, [
                                h(LucideIcon, { name: 'shopping-bag' }),
                                cartCount > 0 && h('span', {
                                    className: 'absolute top-0 right-0 w-4 h-4 bg-accent text-[10px] flex items-center justify-center rounded-full font-bold'
                                }, cartCount)
                            ])
                        ])
                    ])
                ]),

                // Mobile Nav Drawer
                isMobileNavOpen && h('div', { className: 'fixed inset-0 z-[70] sm:hidden' }, [
                    h('div', { className: 'absolute inset-0 bg-black/60 backdrop-blur-sm', onClick: () => setIsMobileNavOpen(false) }),
                    h('div', { className: 'absolute left-0 top-0 bottom-0 w-64 bg-brand border-r border-white/10 p-6 animate-slide-right' }, [
                        h('div', { className: 'flex justify-between items-center mb-8' }, [
                            h('span', { className: 'text-xl font-black text-accent' }, 'MENU'),
                            h('button', { onClick: () => setIsMobileNavOpen(false), 'aria-label': 'Tutup Menu' }, [h(LucideIcon, { name: 'x' })])
                        ]),
                        h('div', { className: 'flex flex-col gap-4' },
                            categories.map(cat => h('button', {
                                key: cat,
                                onClick: () => { setSelectedCategory(cat); setIsMobileNavOpen(false); },
                                className: `text-left py-2 font-bold ${selectedCategory === cat ? 'text-accent' : 'text-white/60'}`
                            }, cat))
                        )
                    ])
                ]),

                // Hero
                h('section', { className: 'pt-32 pb-20 px-4' }, [
                    h('div', { className: 'max-w-7xl mx-auto text-center' }, [
                        h('span', { className: 'text-accent font-bold tracking-widest text-sm uppercase' }, 'Premium Collectibles'),
                        h('h2', { className: 'text-5xl md:text-7xl font-black mt-4 mb-6 leading-none' }, [
                            'KOLEKSI ',
                            h('span', { className: 'text-transparent bg-clip-text bg-gradient-to-r from-accent to-rose-400' }, 'TERLENGKAP')
                        ]),
                        h('p', { className: 'text-white/60 max-w-2xl mx-auto text-lg mb-10' },
                            'Temukan apparel dan aksesoris unik dengan sentuhan aesthetic cinematic. Dari techwear hingga karya seni digital.'
                        ),
                        h('div', { className: 'flex flex-wrap justify-center gap-4' }, [
                            h('a', { href: '#koleksi', className: 'bg-accent hover:bg-rose-700 px-8 py-3 rounded-full font-bold transition-all transform hover:scale-105' }, 'Jelajahi Sekarang'),
                            h('button', {
                                className: 'bg-white/10 hover:bg-white/20 px-8 py-3 rounded-full font-bold transition-all',
                                onClick: () => document.getElementById('koleksi').scrollIntoView({ behavior: 'smooth' })
                            }, 'Lihat Terbaru')
                        ])
                    ])
                ]),

                // Product Grid
                h('section', { id: 'koleksi', className: 'py-20 px-4' }, [
                    h('div', { className: 'max-w-7xl mx-auto' }, [
                        h('div', { className: 'flex justify-between items-end mb-12' }, [
                            h('div', null, [
                                h('h3', { className: 'text-3xl font-bold' }, 'Our Collection'),
                                h('p', { className: 'text-white/40 mt-2' }, `Menampilkan ${filteredProducts.length} produk`)
                            ]),
                            h('div', { className: 'md:hidden flex gap-2' }, [
                                h('button', { className: 'p-2 bg-white/5 rounded-lg' }, [h(LucideIcon, { name: 'sliders-horizontal' })])
                            ])
                        ]),
                        h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8' },
                            filteredProducts.map(product => h('div', {
                                key: product.id,
                                className: 'group relative bg-white/5 border border-white/5 rounded-2xl overflow-hidden hover:border-accent/50 transition-all duration-500'
                            }, [
                                h('div', {
                                    className: 'aspect-[4/5] overflow-hidden cursor-pointer',
                                    onClick: () => setSelectedProduct(product)
                                }, [
                                    h('img', {
                                        src: product.image,
                                        alt: product.name,
                                        className: 'w-full h-full object-cover transition-transform duration-700 group-hover:scale-110'
                                    })
                                ]),
                                h('div', { className: 'p-6' }, [
                                    h('div', { className: 'flex justify-between items-start mb-2' }, [
                                        h('span', { className: 'text-accent text-xs font-bold uppercase tracking-wider' }, product.category),
                                        h('div', { className: 'flex gap-1 text-yellow-500' }, Array(5).fill(null).map((_, i) => h(LucideIcon, { key: i, name: 'star', className: 'w-3 h-3 fill-current' })))
                                    ]),
                                    h('h4', {
                                        className: 'text-xl font-bold mb-1 truncate cursor-pointer hover:text-accent transition-colors',
                                        onClick: () => setSelectedProduct(product)
                                    }, product.name),
                                    h('p', { className: 'text-white/60 text-lg font-semibold mb-6' }, formatIDR(product.price)),
                                    h('div', { className: 'flex gap-2' }, [
                                        h('button', {
                                            className: 'flex-1 bg-white text-brand font-bold py-3 rounded-xl transition-all hover:bg-accent hover:text-white',
                                            onClick: () => addToCart(product)
                                        }, 'Tambah'),
                                        h('button', {
                                            className: 'px-4 bg-white/10 hover:bg-white/20 rounded-xl transition-colors',
                                            onClick: () => handleBuyNow(product),
                                            'aria-label': 'Beli Sekarang via WhatsApp'
                                        }, [h(LucideIcon, { name: 'zap', className: 'fill-current' })])
                                    ])
                                ])
                            ]))
                        )
                    ])
                ]),

                // Footer
                h('footer', { className: 'bg-brand border-t border-white/10 py-12 px-4' }, [
                    h('div', { className: 'max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-12' }, [
                        h('div', { className: 'col-span-1 md:col-span-2' }, [
                            h('h4', { className: 'text-2xl font-black text-accent mb-6' }, CONFIG.BRAND_NAME),
                            h('p', { className: 'text-white/40 max-w-sm' }, 'Destinasi utama untuk koleksi apparel dan aksesoris cinematic dengan kualitas premium. Bergabunglah dengan komunitas aesthetic kami.')
                        ]),
                        h('div', null, [
                            h('h5', { className: 'font-bold mb-6' }, 'Tautan Cepat'),
                            h('ul', { className: 'space-y-4 text-white/40' }, [
                                h('li', null, h('a', { href: '#', className: 'hover:text-accent' }, 'Beranda')),
                                h('li', null, h('a', { href: '#koleksi', className: 'hover:text-accent' }, 'Koleksi')),
                                h('li', null, h('a', { href: '#', className: 'hover:text-accent' }, 'Tentang Kami')),
                                h('li', null, h('a', { href: '#', className: 'hover:text-accent' }, 'Kontak'))
                            ])
                        ]),
                        h('div', null, [
                            h('h5', { className: 'font-bold mb-6' }, 'Hubungi Kami'),
                            h('ul', { className: 'space-y-4 text-white/40' }, [
                                h('li', { className: 'flex items-center gap-3' }, [h(LucideIcon, { name: 'mail', className: 'w-4 h-4' }), 'info@tktm.shop']),
                                h('li', { className: 'flex items-center gap-3' }, [h(LucideIcon, { name: 'phone', className: 'w-4 h-4' }), '+62 889-7326-2022'])
                            ])
                        ])
                    ]),
                    h('div', { className: 'max-w-7xl mx-auto mt-12 pt-12 border-t border-white/5 text-center text-white/20 text-sm' },
                        `© ${new Date().getFullYear()} ${CONFIG.BRAND_NAME}. All rights reserved.`
                    )
                ]),

                // Cart Drawer
                isCartOpen && h('div', { className: 'fixed inset-0 z-[60]' }, [
                    h('div', { className: 'absolute inset-0 bg-black/60 backdrop-blur-sm', onClick: () => setIsCartOpen(false) }),
                    h('div', { id: 'cart-drawer', className: 'absolute right-0 top-0 bottom-0 w-full max-w-md bg-brand border-l border-white/10 flex flex-col animate-slide-left' }, [
                        h('div', { className: 'p-6 border-b border-white/10 flex justify-between items-center' }, [
                            h('div', { className: 'flex items-center gap-3' }, [
                                h(LucideIcon, { name: 'shopping-cart', className: 'text-accent' }),
                                h('h3', { className: 'text-xl font-bold' }, 'Keranjang')
                            ]),
                            h('button', { onClick: () => setIsCartOpen(false), 'aria-label': 'Tutup Keranjang' }, [h(LucideIcon, { name: 'x' })])
                        ]),
                        h('div', { className: 'flex-1 overflow-y-auto p-6' },
                            cart.length === 0 ? h('div', { className: 'h-full flex flex-col items-center justify-center text-white/20 gap-4' }, [
                                h(LucideIcon, { name: 'package-open', className: 'w-16 h-16' }),
                                h('p', { className: 'font-bold' }, 'Keranjangmu masih kosong')
                            ]) : cart.map(item => h('div', { key: item.id, className: 'flex gap-4 mb-6' }, [
                                h('img', { src: item.image, className: 'w-20 h-20 object-cover rounded-xl' }),
                                h('div', { className: 'flex-1' }, [
                                    h('h4', { className: 'font-bold' }, item.name),
                                    h('p', { className: 'text-accent text-sm font-bold' }, formatIDR(item.price)),
                                    h('div', { className: 'flex items-center gap-3 mt-2' }, [
                                        h('button', {
                                            className: 'w-6 h-6 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/5',
                                            onClick: () => setCart(prev => prev.map(i => i.id === item.id ? { ...i, quantity: Math.max(1, i.quantity - 1) } : i))
                                        }, '-'),
                                        h('span', null, item.quantity),
                                        h('button', {
                                            className: 'w-6 h-6 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/5',
                                            onClick: () => setCart(prev => prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i))
                                        }, '+')
                                    ])
                                ]),
                                h('button', { className: 'text-white/20 hover:text-accent', onClick: () => removeFromCart(item.id) }, [h(LucideIcon, { name: 'trash-2' })])
                            ]))
                        ),
                        cart.length > 0 && h('div', { className: 'p-6 border-t border-white/10 bg-white/5' }, [
                            h('div', { className: 'flex justify-between items-center mb-6' }, [
                                h('span', { className: 'text-white/40' }, 'Total Pembayaran'),
                                h('span', { className: 'text-2xl font-black' }, formatIDR(cartTotal))
                            ]),
                            h('button', {
                                className: 'w-full bg-accent hover:bg-rose-700 py-4 rounded-2xl font-black flex items-center justify-center gap-3 transition-all',
                                onClick: handleCheckout
                            }, [
                                h(LucideIcon, { name: 'credit-card' }),
                                'CHECKOUT VIA WHATSAPP'
                            ])
                        ])
                    ])
                ]),

                // Product Modal
                selectedProduct && h('div', { className: 'fixed inset-0 z-[80] flex items-center justify-center p-4' }, [
                    h('div', { className: 'absolute inset-0 bg-black/90 backdrop-blur-md', onClick: () => setSelectedProduct(null) }),
                    h('div', { className: 'relative bg-brand border border-white/10 w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-3xl grid grid-cols-1 md:grid-cols-2' }, [
                        h('button', {
                            className: 'absolute right-6 top-6 z-10 p-2 bg-brand/80 rounded-full border border-white/10',
                            onClick: () => setSelectedProduct(null)
                        }, [h(LucideIcon, { name: 'x' })]),
                        h('div', { className: 'p-4' }, [
                            h('img', { src: selectedProduct.image, className: 'w-full aspect-square object-cover rounded-2xl' }),
                            h('div', { className: 'grid grid-cols-4 gap-2 mt-4' },
                                selectedProduct.images.map((img, i) => h('img', {
                                    key: i,
                                    src: img,
                                    className: 'aspect-square object-cover rounded-lg cursor-pointer hover:opacity-50 transition-opacity',
                                    onClick: () => setSelectedProduct({ ...selectedProduct, image: img })
                                }))
                            )
                        ]),
                        h('div', { className: 'p-8 flex flex-col justify-center' }, [
                            h('span', { className: 'text-accent font-bold uppercase tracking-widest text-sm mb-2' }, selectedProduct.category),
                            h('h3', { className: 'text-4xl font-black mb-4' }, selectedProduct.name),
                            h('p', { className: 'text-white/40 mb-8 leading-relaxed' }, selectedProduct.description),
                            h('div', { className: 'flex items-center justify-between mb-8 pb-8 border-b border-white/10' }, [
                                h('span', { className: 'text-3xl font-black' }, formatIDR(selectedProduct.price)),
                                h('div', { className: 'flex items-center gap-1 text-accent' }, [
                                    h(LucideIcon, { name: 'package', className: 'w-4 h-4' }),
                                    h('span', { className: 'text-xs font-bold' }, 'STOK TERBATAS')
                                ])
                            ]),
                            h('div', { className: 'flex gap-4' }, [
                                h('button', {
                                    className: 'flex-1 bg-white text-brand font-black py-4 rounded-2xl hover:bg-accent hover:text-white transition-all',
                                    onClick: () => { addToCart(selectedProduct); setSelectedProduct(null); }
                                }, 'TAMBAH KE KERANJANG'),
                                h('button', {
                                    className: 'px-6 border border-white/10 rounded-2xl hover:bg-white/10 transition-colors',
                                    onClick: () => handleBuyNow(selectedProduct)
                                }, [h(LucideIcon, { name: 'heart' })])
                            ])
                        ])
                    ])
                ]),

                // Toast
                toast && h(Toast, { message: toast, onClose: () => setToast(null) })
            ]);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>
</html>
