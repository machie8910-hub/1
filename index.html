<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKTM | Cinematic Streetwear</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0a0a0a',
                        accent: '#e11d48',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-scale': 'fadeInScale 0.5s ease-out forwards',
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-brand text-white selection:bg-accent selection:text-white;
            }
            ::-webkit-scrollbar {
                @apply w-1.5;
            }
            ::-webkit-scrollbar-track {
                @apply bg-brand;
            }
            ::-webkit-scrollbar-thumb {
                @apply bg-neutral-800 rounded-full hover:bg-neutral-700 transition-colors;
            }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .animate-in {
            animation: fadeInScale 0.5s ease-out forwards;
        }

        /* Glassmorphism */
        .glass {
            @apply bg-neutral-900/80 backdrop-blur-md border border-white/5;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="App.jsx"></script>
</body>
</html>
