<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKTM - Toko Koleksi Terlengkap</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0a0a0a',
                        accent: '#e11d48',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-brand text-white antialiased selection:bg-accent selection:text-white;
            }
        }
        @layer components {
            .btn-primary {
                @apply bg-accent hover:bg-rose-700 text-white font-bold py-2 px-6 rounded-full transition-all duration-300 transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2;
            }
            .card-glass {
                @apply bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl overflow-hidden hover:border-accent/50 transition-all duration-500;
            }
        }
    </style>

    <!-- Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect } = React;

        const CONFIG = {
            brandName: 'TKTM',
            whatsappNumber: '6288973262022',
            currency: 'Rp'
        };

        const PRODUCTS = [
            {
                id: 1,
                name: "Denji Chainsaw Man Figure",
                price: 850000,
                category: "Action Figure",
                images: ["https://images.unsplash.com/photo-1618331835717-801e976710b2?q=80&w=800&auto=format&fit=crop"],
                description: "Action figure Denji dari serial Chainsaw Man dengan detail yang sangat tinggi.",
                isNew: true
            },
            {
                id: 2,
                name: "Jujutsu Kaisen Vol. 0 Poster",
                price: 150000,
                category: "Poster",
                images: ["https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=800&auto=format&fit=crop"],
                description: "Poster resmi Jujutsu Kaisen 0. Kertas art carton 260gsm.",
                isNew: false
            }
        ];

        const LucideIcon = ({ name, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return React.createElement('i', { 'data-lucide': name, className: className });
        };

        const App = () => {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? {...item, quantity: item.quantity + 1} : item);
                    return [...prev, {...product, quantity: 1}];
                });
            };

            const ce = React.createElement;

            return ce('div', { className: 'min-h-screen' },
                ce('nav', { className: 'fixed top-0 left-0 right-0 z-50 bg-brand/90 backdrop-blur-md py-4 border-b border-white/10' },
                    ce('div', { className: 'container mx-auto px-4 flex items-center justify-between' },
                        ce('div', { className: 'text-2xl font-black text-accent' }, 'TKTM'),
                        ce('button', {
                            onClick: () => setIsCartOpen(true),
                            className: 'relative p-2',
                            'aria-label': 'Keranjang'
                        },
                            ce(LucideIcon, { name: 'shopping-cart', className: 'w-6 h-6' }),
                            cart.length > 0 && ce('span', { className: 'absolute top-0 right-0 bg-accent text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold' },
                                cart.reduce((a, b) => a + b.quantity, 0)
                            )
                        )
                    )
                ),
                ce('main', { className: 'pt-32 pb-20' },
                    ce('div', { className: 'container mx-auto px-4' },
                        ce('h1', { className: 'text-5xl font-black mb-12 italic uppercase tracking-tighter' },
                            'Koleksi ', ce('span', { className: 'text-accent' }, 'Eksklusif')
                        ),
                        ce('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8' },
                            PRODUCTS.map(product =>
                                ce('div', { key: product.id, className: 'card-glass group cursor-pointer', onClick: () => setSelectedProduct(product) },
                                    ce('div', { className: 'aspect-[3/4] relative overflow-hidden' },
                                        ce('img', { src: product.images[0], alt: product.name, className: 'w-full h-full object-cover transition-transform group-hover:scale-110' }),
                                        ce('div', { className: 'absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center p-4' },
                                            ce('button', {
                                                onClick: (e) => { e.stopPropagation(); addToCart(product); },
                                                className: 'btn-primary w-full'
                                            }, 'Tambah ke Keranjang')
                                        )
                                    ),
                                    ce('div', { className: 'p-6' },
                                        ce('h3', { className: 'font-bold text-lg mb-2' }, product.name),
                                        ce('p', { className: 'text-accent font-black text-xl' }, `${CONFIG.currency} ${product.price.toLocaleString('id-ID')}`)
                                    )
                                )
                            )
                        )
                    )
                ),
                selectedProduct && ce('div', { className: 'fixed inset-0 z-[100] flex items-center justify-center p-4 bg-brand/95 backdrop-blur-xl' },
                    ce('div', { className: 'bg-[#111] border border-white/10 rounded-3xl max-w-4xl w-full overflow-hidden flex flex-col md:flex-row relative' },
                        ce('button', { onClick: () => setSelectedProduct(null), className: 'absolute top-4 right-4 z-10 bg-black/50 p-2 rounded-full' },
                            ce(LucideIcon, { name: 'x', className: 'w-6 h-6' })
                        ),
                        ce('div', { className: 'md:w-1/2' },
                            ce('img', { src: selectedProduct.images[0], alt: selectedProduct.name, className: 'w-full h-full object-cover' })
                        ),
                        ce('div', { className: 'md:w-1/2 p-8 md:p-12' },
                            ce('h2', { className: 'text-4xl font-black mb-6' }, selectedProduct.name),
                            ce('p', { className: 'text-accent font-black text-3xl mb-8' }, `${CONFIG.currency} ${selectedProduct.price.toLocaleString('id-ID')}`),
                            ce('p', { className: 'text-white/60 mb-12 text-lg leading-relaxed' }, selectedProduct.description),
                            ce('div', { className: 'grid grid-cols-2 gap-4' },
                                ce('button', { className: 'btn-primary py-4' }, 'Beli Sekarang'),
                                ce('button', {
                                    onClick: () => { addToCart(selectedProduct); setSelectedProduct(null); },
                                    className: 'bg-white/10 hover:bg-white/20 py-4 rounded-full font-bold transition-all'
                                }, 'Tambah ke Keranjang')
                            )
                        )
                    )
                ),
                isCartOpen && ce('div', { className: 'fixed inset-0 z-[110] bg-brand/80 backdrop-blur-sm' },
                    ce('div', { id: 'cart-drawer', className: 'absolute top-0 right-0 h-full w-full max-w-md bg-[#111] flex flex-col border-l border-white/10 shadow-2xl' },
                        ce('div', { className: 'p-6 border-b border-white/10 flex justify-between items-center' },
                            ce('h2', { className: 'text-xl font-black italic tracking-tighter' }, 'KERANJANG BELANJA'),
                            ce('button', { onClick: () => setIsCartOpen(false) }, ce(LucideIcon, { name: 'x', className: 'w-6 h-6' }))
                        ),
                        ce('div', { className: 'flex-1 overflow-y-auto p-6 space-y-6' },
                            cart.length === 0 ? ce('div', { className: 'h-full flex flex-col items-center justify-center text-white/20' },
                                ce(LucideIcon, { name: 'shopping-cart', className: 'w-16 h-16 mb-4' }),
                                ce('p', { className: 'font-bold' }, 'Keranjang kosong')
                            ) : cart.map((item) =>
                                ce('div', { key: item.id, className: 'flex gap-4' },
                                    ce('div', { className: 'w-20 h-20 bg-black rounded-lg overflow-hidden flex-shrink-0' },
                                        ce('img', { src: item.images[0], className: 'w-full h-full object-cover' })
                                    ),
                                    ce('div', { className: 'flex-1 min-w-0' },
                                        ce('h4', { className: 'font-bold text-sm mb-1 truncate' }, item.name),
                                        ce('p', { className: 'text-accent font-black' }, `${CONFIG.currency} ${item.price.toLocaleString('id-ID')}`),
                                        ce('p', { className: 'text-[10px] text-white/30 uppercase mt-1' }, `Qty: ${item.quantity}`)
                                    )
                                )
                            )
                        ),
                        cart.length > 0 && ce('div', { className: 'p-6 border-t border-white/10 space-y-6' },
                            ce('div', { className: 'flex justify-between items-center' },
                                ce('span', { className: 'text-white/50' }, 'Total'),
                                ce('span', { className: 'text-2xl font-black text-accent' }, `${CONFIG.currency} ${cart.reduce((a, b) => a + (b.price * b.quantity), 0).toLocaleString('id-ID')}`)
                            ),
                            ce('button', { className: 'btn-primary w-full py-4 text-lg' }, 'Selesaikan Pembelian')
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
