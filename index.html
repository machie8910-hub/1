<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKTM - Topiku Topimu</title>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="container nav-content">
            <a href="#" class="logo">TKTM<span>.</span></a>

            <div class="nav-actions">
                <button class="icon-btn hide-mobile" id="search-trigger">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
                <button class="icon-btn" id="cart-trigger">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <header class="hero">
        <div class="container hero-content animate-in">
            <h1>Topiku Topimu</h1>
            <p>Eksplorasi koleksi topi premium dengan desain minimalis dan material berkualitas tinggi untuk gaya harianmu.</p>
            <a href="#shop" class="btn-primary">Lihat Koleksi</a>
        </div>
    </header>

    <!-- Shop -->
    <main class="container shop-section" id="shop">
        <div class="section-header">
            <h2>Katalog Terbaru</h2>
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Cari topi...">
            </div>
        </div>

        <div class="product-grid" id="product-grid">
            <!-- Products will be injected here -->
        </div>
    </main>

    <!-- Overlays -->
    <div class="overlay" id="overlay"></div>

    <!-- Cart Drawer -->
    <aside class="drawer" id="cart-drawer">
        <button class="modal-close" id="close-cart"><i class="fa-solid fa-xmark"></i></button>
        <h2 style="margin-bottom: 30px;">Keranjang</h2>
        <div id="cart-items" style="flex: 1; overflow-y: auto;">
            <!-- Cart items will be injected here -->
        </div>
        <div id="cart-footer" style="padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <div style="display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; margin-bottom: 20px;">
                <span>Total</span>
                <span id="cart-total">Rp 0</span>
            </div>
            <button class="btn-primary" id="checkout-btn" style="width: 100%;">Checkout via WhatsApp</button>
        </div>
    </aside>

    <!-- Product Modal -->
    <div class="overlay" id="modal-overlay">
        <div class="modal" id="product-modal">
            <button class="modal-close" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
            <!-- Modal content injected by script -->
        </div>
    </div>

    <!-- Toasts -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
