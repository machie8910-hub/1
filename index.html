<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKTM - Toko Koleksi Terlengkap</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v3.4.1 -->
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>

    <!-- React & ReactDOM (Pinned v18.2.0) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

    <!-- Lucide Icons (Pinned v0.294.0) -->
    <script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0a0a0a',
                        accent: '#e11d48', // Rose-600 (Anime Red)
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-brand text-gray-100 antialiased;
            }

            /* Custom Scrollbar */
            ::-webkit-scrollbar {
                width: 8px;
            }
            ::-webkit-scrollbar-track {
                @apply bg-brand;
            }
            ::-webkit-scrollbar-thumb {
                @apply bg-zinc-800 rounded-full border-2 border-brand;
            }
            ::-webkit-scrollbar-thumb:hover {
                @apply bg-zinc-700;
            }
        }

        @layer components {
            .btn-primary {
                @apply bg-accent hover:bg-rose-700 text-white font-semibold py-2 px-6 rounded-lg transition-all duration-300 transform hover:scale-105 active:scale-95;
            }

            .glass-panel {
                @apply bg-zinc-900/50 backdrop-blur-md border border-zinc-800;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/javascript">
        const { createElement: h, useState, useEffect, useMemo, useCallback } = React;

        const CONFIG = {
            brandName: 'TKTM',
            whatsappNumber: '6288973262022',
            currency: 'IDR',
        };

        const PRODUCTS = [
            {
                id: 1,
                name: "Mechanical Keyboard Pro",
                category: "Accessories",
                price: 1250000,
                description: "Keyboard mekanik kelas profesional dengan switch tactile dan pencahayaan RGB yang dapat disesuaikan. Didesain untuk kenyamanan mengetik maksimal.",
                images: [
                    "https://images.unsplash.com/photo-1511467687858-23d96c32e4ae?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1595225476474-87563907a212?auto=format&fit=crop&q=80&w=800"
                ],
                rating: 4.8,
                reviews: 124
            },
            {
                id: 2,
                name: "Ultra-Wide Monitor 34\"",
                category: "Display",
                price: 5499000,
                description: "Monitor ultra-wide dengan refresh rate 144Hz dan akurasi warna tinggi. Sempurna untuk gaming dan produktivitas multitasking.",
                images: [
                    "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1585792180666-f7347c490ee2?auto=format&fit=crop&q=80&w=800"
                ],
                rating: 4.9,
                reviews: 85
            },
            {
                id: 3,
                name: "Wireless Studio Headset",
                category: "Audio",
                price: 2150000,
                description: "Headset nirkabel dengan fitur noise cancellation aktif dan kualitas audio studio. Baterai tahan hingga 30 jam pemakaian.",
                images: [
                    "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1484704849700-f032a568e944?auto=format&fit=crop&q=80&w=800"
                ],
                rating: 4.7,
                reviews: 210
            },
            {
                id: 4,
                name: "Ergonomic Desk Chair",
                category: "Furniture",
                price: 3850000,
                description: "Kursi kerja ergonomis dengan dukungan lumbar yang dapat disesuaikan dan bahan mesh yang breathable.",
                images: [
                    "https://images.unsplash.com/photo-1505797149-35ebcb05a6fd?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1589384273441-c5ae2f67184f?auto=format&fit=crop&q=80&w=800"
                ],
                rating: 4.6,
                reviews: 56
            },
            {
                id: 5,
                name: "Portable SSD 1TB",
                category: "Storage",
                price: 1850000,
                description: "SSD eksternal super cepat dengan koneksi USB-C. Tahan guncangan dan ukuran yang sangat ringkas.",
                images: [
                    "https://images.unsplash.com/photo-1597740985671-2a8a3b80ec0e?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1531297484001-80022131f5a1?auto=format&fit=crop&q=80&w=800"
                ],
                rating: 4.9,
                reviews: 342
            },
            {
                id: 6,
                name: "4K Action Camera",
                category: "Camera",
                price: 2999000,
                description: "Kamera aksi dengan kemampuan rekam 4K 60fps dan stabilisasi gambar canggih. Tahan air hingga kedalaman 10 meter.",
                images: [
                    "https://images.unsplash.com/photo-1526170315873-3a56162824cf?auto=format&fit=crop&q=80&w=800",
                    "https://images.unsplash.com/photo-1502982720700-bfff97f2ecac?auto=format&fit=crop&q=80&w=800"
                ],
                rating: 4.5,
                reviews: 98
            }
        ];

        // Helper: Format Currency
        const formatPrice = (amount) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
            }).format(amount);
        };

        // Component: LucideIcon
        const LucideIcon = ({ name, className = "w-5 h-5", size, strokeWidth }) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    if (window.lucide) {
                        window.lucide.createIcons({
                            attrs: {
                                class: className,
                                ...(size && { 'stroke-width': strokeWidth || 2, width: size, height: size })
                            },
                            nameAttr: 'data-lucide'
                        });
                    }
                }, 0);
                return () => clearTimeout(timer);
            }, [name, className, size, strokeWidth]);

            return h('i', { 'data-lucide': name, className });
        };

        // Toast Component (Internal State Management later)
        const Toast = ({ message, visible, onClose }) => {
            if (!visible) return null;
            return h('div', {
                className: "fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] glass-panel px-6 py-3 rounded-full flex items-center gap-3 animate-bounce shadow-2xl"
            }, [
                h(LucideIcon, { name: 'check-circle', className: "text-green-500 w-5 h-5" }),
                h('span', { className: "text-sm font-medium text-white" }, message)
            ]);
        };

        // Component: Navbar
        const Navbar = ({ cartCount, onOpenCart, onSearch, searchQuery }) => {
            return h('nav', {
                className: "sticky top-0 z-50 bg-brand/80 backdrop-blur-md border-b border-zinc-800"
            }, [
                h('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" }, [
                    h('div', { className: "flex items-center justify-between h-16" }, [
                        // Logo
                        h('div', { className: "flex-shrink-0 flex items-center gap-2" }, [
                            h('div', { className: "w-8 h-8 bg-accent rounded-lg flex items-center justify-center" }, [
                                h(LucideIcon, { name: 'package', className: "text-white w-5 h-5" })
                            ]),
                            h('span', { className: "text-xl font-bold tracking-tighter text-white" }, CONFIG.brandName)
                        ]),

                        // Search Bar (Desktop)
                        h('div', { className: "hidden md:block flex-1 max-w-md mx-8" }, [
                            h('div', { className: "relative" }, [
                                h(LucideIcon, { name: 'search', className: "absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 w-4 h-4" }),
                                h('input', {
                                    type: "text",
                                    placeholder: "Cari produk terbaik...",
                                    value: searchQuery,
                                    onChange: (e) => onSearch(e.target.value),
                                    className: "w-full bg-zinc-900 border border-zinc-800 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-accent transition-colors text-white"
                                })
                            ])
                        ]),

                        // Right Actions
                        h('div', { className: "flex items-center gap-4" }, [
                            h('button', {
                                onClick: onOpenCart,
                                'aria-label': "Keranjang",
                                className: "relative p-2 text-zinc-400 hover:text-white transition-colors"
                            }, [
                                h(LucideIcon, { name: 'shopping-cart', className: "w-6 h-6" }),
                                cartCount > 0 && h('span', {
                                    className: "absolute top-0 right-0 bg-accent text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-brand"
                                }, cartCount)
                            ]),
                            h('button', {
                                className: "md:hidden p-2 text-zinc-400 hover:text-white transition-colors"
                            }, [
                                h(LucideIcon, { name: 'menu', className: "w-6 h-6" })
                            ])
                        ])
                    ])
                ])
            ]);
        };

        // Component: Hero
        const Hero = () => {
            return h('section', {
                className: "relative overflow-hidden pt-16 pb-20 lg:pt-24 lg:pb-32"
            }, [
                // Background Effects
                h('div', {
                    className: "absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-full -z-10"
                }, [
                    h('div', { className: "absolute top-[-10%] left-[-10%] w-[40%] h-[60%] bg-accent/20 blur-[120px] rounded-full" }),
                    h('div', { className: "absolute bottom-[-10%] right-[-10%] w-[40%] h-[60%] bg-blue-500/10 blur-[120px] rounded-full" })
                ]),

                h('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center" }, [
                    h('h1', {
                        className: "text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight mb-6"
                    }, [
                        h('span', { className: "block" }, "Koleksi Terlengkap,"),
                        h('span', { className: "block text-accent" }, "Gaya Hidup Modern.")
                    ]),
                    h('p', {
                        className: "max-w-2xl mx-auto text-lg sm:text-xl text-zinc-400 mb-10"
                    }, "Temukan berbagai produk berkualitas tinggi untuk mendukung produktivitas dan hiburan Anda. Dari setup meja hingga aksesoris harian."),
                    h('div', { className: "flex flex-col sm:flex-row items-center justify-center gap-4" }, [
                        h('a', {
                            href: "#koleksi",
                            className: "btn-primary w-full sm:w-auto"
                        }, "Lihat Koleksi"),
                        h('button', {
                            className: "w-full sm:w-auto px-6 py-2 rounded-lg border border-zinc-800 hover:bg-zinc-900 transition-colors font-semibold"
                        }, "Tentang Kami")
                    ])
                ])
            ]);
        };

        // Component: ProductCard
        const ProductCard = ({ product, onOpenDetails, onAddToCart, onBuyNow }) => {
            return h('div', {
                className: "glass-panel rounded-2xl overflow-hidden group transition-all duration-300 hover:border-accent/50"
            }, [
                // Image Container
                h('div', {
                    className: "relative aspect-[4/5] overflow-hidden cursor-pointer",
                    onClick: () => onOpenDetails(product)
                }, [
                    h('img', {
                        src: product.images[0],
                        alt: product.name,
                        className: "w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                    }),
                    h('div', {
                        className: "absolute top-3 left-3 bg-brand/60 backdrop-blur-md px-3 py-1 rounded-full border border-zinc-800"
                    }, [
                        h('span', { className: "text-[10px] font-bold uppercase tracking-widest text-zinc-300" }, product.category)
                    ])
                ]),

                // Content
                h('div', { className: "p-5" }, [
                    h('div', { className: "flex justify-between items-start mb-2" }, [
                        h('h3', {
                            className: "font-bold text-lg text-white group-hover:text-accent transition-colors cursor-pointer",
                            onClick: () => onOpenDetails(product)
                        }, product.name),
                        h('div', { className: "flex items-center gap-1 text-yellow-500" }, [
                            h(LucideIcon, { name: 'star', className: "w-3 h-3 fill-current" }),
                            h('span', { className: "text-xs font-bold text-zinc-400" }, product.rating)
                        ])
                    ]),
                    h('p', { className: "text-accent font-bold text-xl mb-4" }, formatPrice(product.price)),

                    // Actions
                    h('div', { className: "flex gap-2" }, [
                        h('button', {
                            onClick: () => onBuyNow(product),
                            className: "flex-1 btn-primary text-sm py-2 px-0"
                        }, "Beli"),
                        h('button', {
                            onClick: () => onAddToCart(product),
                            'aria-label': `Tambah ${product.name} ke keranjang`,
                            className: "p-2 rounded-lg border border-zinc-800 hover:bg-zinc-800 transition-colors text-white"
                        }, [
                            h(LucideIcon, { name: 'shopping-cart', className: "w-5 h-5" })
                        ])
                    ])
                ])
            ]);
        };

        // Component: ProductModal
        const ProductModal = ({ product, isOpen, onClose, onAddToCart, onBuyNow }) => {
            const [activeImage, setActiveImage] = useState(0);

            useEffect(() => {
                if (product) setActiveImage(0);
            }, [product]);

            if (!isOpen || !product) return null;

            return h('div', {
                className: "fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6"
            }, [
                // Backdrop
                h('div', {
                    className: "absolute inset-0 bg-brand/90 backdrop-blur-sm",
                    onClick: onClose
                }),

                // Content
                h('div', {
                    className: "relative w-full max-w-5xl glass-panel rounded-3xl overflow-hidden flex flex-col md:flex-row max-h-[90vh]"
                }, [
                    // Close Button
                    h('button', {
                        onClick: onClose,
                        className: "absolute top-4 right-4 z-10 p-2 bg-brand/50 rounded-full text-zinc-400 hover:text-white transition-colors"
                    }, [
                        h(LucideIcon, { name: 'x', className: "w-6 h-6" })
                    ]),

                    // Left: Gallery
                    h('div', { className: "md:w-1/2 bg-zinc-950 flex flex-col" }, [
                        h('div', { className: "flex-1 relative overflow-hidden" }, [
                            h('img', {
                                src: product.images[activeImage],
                                alt: product.name,
                                className: "w-full h-full object-cover"
                            })
                        ]),
                        h('div', { className: "flex p-4 gap-4 overflow-x-auto" },
                            product.images.map((img, idx) =>
                                h('button', {
                                    key: idx,
                                    onClick: () => setActiveImage(idx),
                                    className: `relative flex-shrink-0 w-20 aspect-square rounded-lg overflow-hidden border-2 transition-all ${activeImage === idx ? 'border-accent' : 'border-transparent'}`
                                }, [
                                    h('img', { src: img, className: "w-full h-full object-cover" })
                                ])
                            )
                        )
                    ]),

                    // Right: Details
                    h('div', { className: "md:w-1/2 p-8 overflow-y-auto" }, [
                        h('div', { className: "mb-6" }, [
                            h('span', { className: "text-accent font-bold uppercase tracking-widest text-xs mb-2 block" }, product.category),
                            h('h2', { className: "text-3xl font-extrabold text-white mb-2" }, product.name),
                            h('div', { className: "flex items-center gap-4 text-zinc-400 text-sm" }, [
                                h('div', { className: "flex items-center gap-1 text-yellow-500" }, [
                                    h(LucideIcon, { name: 'star', className: "w-4 h-4 fill-current" }),
                                    h('span', { className: "font-bold" }, product.rating)
                                ]),
                                h('span', {}, `(${product.reviews} ulasan)`)
                            ])
                        ]),

                        h('p', { className: "text-zinc-400 leading-relaxed mb-8" }, product.description),

                        h('div', { className: "mb-8" }, [
                            h('span', { className: "text-sm text-zinc-500 block mb-1" }, "Harga"),
                            h('span', { className: "text-3xl font-black text-white" }, formatPrice(product.price))
                        ]),

                        h('div', { className: "flex flex-col sm:flex-row gap-4" }, [
                            h('button', {
                                onClick: () => onBuyNow(product),
                                className: "flex-1 btn-primary py-4"
                            }, "Beli Sekarang (WhatsApp)"),
                            h('button', {
                                onClick: () => onAddToCart(product),
                                className: "flex-1 py-4 border border-zinc-800 rounded-lg hover:bg-zinc-900 transition-colors font-bold text-white flex items-center justify-center gap-2"
                            }, [
                                h(LucideIcon, { name: 'shopping-cart', className: "w-5 h-5" }),
                                "Tambah ke Keranjang"
                            ])
                        ])
                    ])
                ])
            ]);
        };

        // Component: ProductGrid
        const ProductGrid = ({ products, onOpenDetails, onAddToCart, onBuyNow }) => {
            return h('section', {
                id: "koleksi",
                className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20"
            }, [
                h('div', { className: "flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12" }, [
                    h('div', {}, [
                        h('h2', { className: "text-3xl font-black text-white mb-2" }, "Koleksi Terbaru"),
                        h('p', { className: "text-zinc-500" }, "Pilihan produk terbaik untuk menunjang performa Anda.")
                    ]),
                    h('div', { className: "flex gap-2" },
                        ["Semua", "Accessories", "Audio", "Display"].map(cat =>
                            h('button', {
                                key: cat,
                                className: `px-4 py-2 rounded-full text-sm font-semibold border transition-all ${cat === 'Semua' ? 'bg-accent border-accent text-white' : 'border-zinc-800 text-zinc-500 hover:border-zinc-700'}`
                            }, cat)
                        )
                    )
                ]),

                h('div', {
                    className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"
                }, products.map(p =>
                    h(ProductCard, {
                        key: p.id,
                        product: p,
                        onOpenDetails,
                        onAddToCart,
                        onBuyNow
                    })
                ))
            ]);
        };

        // Component: CartDrawer
        const CartDrawer = ({ isOpen, onClose, cart, onRemove, onUpdateQuantity, onCheckout }) => {
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            if (!isOpen) return null;

            return h('div', {
                id: "cart-drawer",
                className: "fixed inset-0 z-[110] overflow-hidden"
            }, [
                h('div', {
                    className: "absolute inset-0 bg-brand/60 backdrop-blur-sm",
                    onClick: onClose
                }),
                h('div', {
                    className: "absolute inset-y-0 right-0 max-w-full flex"
                }, [
                    h('div', {
                        className: "w-screen max-w-md glass-panel shadow-2xl flex flex-col"
                    }, [
                        // Header
                        h('div', { className: "p-6 border-b border-zinc-800 flex items-center justify-between" }, [
                            h('h2', { className: "text-xl font-bold text-white flex items-center gap-3" }, [
                                h(LucideIcon, { name: 'shopping-cart' }),
                                "Keranjang Anda"
                            ]),
                            h('button', { onClick: onClose, className: "text-zinc-500 hover:text-white" }, [
                                h(LucideIcon, { name: 'x' })
                            ])
                        ]),

                        // Items
                        h('div', { className: "flex-1 overflow-y-auto p-6 space-y-6" },
                            cart.length === 0 ?
                                h('div', { className: "h-full flex flex-col items-center justify-center text-center opacity-50" }, [
                                    h(LucideIcon, { name: 'shopping-bag', size: 48, className: "mb-4" }),
                                    h('p', {}, "Keranjang Anda kosong")
                                ]) :
                                cart.map(item => h('div', { key: item.id, className: "flex gap-4" }, [
                                    h('img', { src: item.images[0], className: "w-20 h-20 object-cover rounded-lg border border-zinc-800" }),
                                    h('div', { className: "flex-1" }, [
                                        h('h4', { className: "font-bold text-white text-sm" }, item.name),
                                        h('p', { className: "text-accent font-bold text-sm mb-2" }, formatPrice(item.price)),
                                        h('div', { className: "flex items-center gap-4" }, [
                                            h('div', { className: "flex items-center border border-zinc-800 rounded-md" }, [
                                                h('button', {
                                                    onClick: () => onUpdateQuantity(item.id, item.quantity - 1),
                                                    className: "p-1 hover:bg-zinc-800 text-zinc-400"
                                                }, h(LucideIcon, { name: 'minus', size: 14 })),
                                                h('span', { className: "px-3 text-xs font-bold text-white" }, item.quantity),
                                                h('button', {
                                                    onClick: () => onUpdateQuantity(item.id, item.quantity + 1),
                                                    className: "p-1 hover:bg-zinc-800 text-zinc-400"
                                                }, h(LucideIcon, { name: 'plus', size: 14 }))
                                            ]),
                                            h('button', {
                                                onClick: () => onRemove(item.id),
                                                className: "text-xs text-zinc-500 hover:text-accent font-bold"
                                            }, "Hapus")
                                        ])
                                    ])
                                ]))
                        ),

                        // Footer
                        cart.length > 0 && h('div', { className: "p-6 border-t border-zinc-800 bg-zinc-950/50" }, [
                            h('div', { className: "flex justify-between mb-4" }, [
                                h('span', { className: "text-zinc-500" }, "Total"),
                                h('span', { className: "text-xl font-black text-white" }, formatPrice(total))
                            ]),
                            h('button', {
                                onClick: onCheckout,
                                className: "w-full btn-primary py-4 flex items-center justify-center gap-3"
                            }, [
                                h(LucideIcon, { name: 'whatsapp', className: "w-5 h-5" }),
                                "Checkout via WhatsApp"
                            ])
                        ])
                    ])
                ])
            ]);
        };

        // Component: Footer
        const Footer = () => {
            return h('footer', { className: "border-t border-zinc-800 pt-20 pb-10 mt-20" }, [
                h('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" }, [
                    h('div', { className: "grid grid-cols-1 md:grid-cols-4 gap-12 mb-16" }, [
                        h('div', { className: "col-span-1 md:col-span-2" }, [
                            h('div', { className: "flex items-center gap-2 mb-6" }, [
                                h('div', { className: "w-8 h-8 bg-accent rounded-lg flex items-center justify-center text-white" }, [
                                    h(LucideIcon, { name: 'package', size: 20 })
                                ]),
                                h('span', { className: "text-2xl font-black tracking-tighter text-white" }, CONFIG.brandName)
                            ]),
                            h('p', { className: "text-zinc-500 max-w-sm leading-relaxed" },
                                "Destinasi utama untuk koleksi produk lifestyle dan teknologi pilihan. Kami menghadirkan kualitas terbaik langsung ke tangan Anda."
                            )
                        ]),
                        h('div', {}, [
                            h('h4', { className: "text-white font-bold mb-6" }, "Toko"),
                            h('ul', { className: "space-y-4 text-sm text-zinc-500" }, [
                                h('li', {}, h('a', { href: "#", className: "hover:text-accent" }, "Beranda")),
                                h('li', {}, h('a', { href: "#koleksi", className: "hover:text-accent" }, "Koleksi")),
                                h('li', {}, h('a', { href: "#", className: "hover:text-accent" }, "Terbaru"))
                            ])
                        ]),
                        h('div', {}, [
                            h('h4', { className: "text-white font-bold mb-6" }, "Kontak"),
                            h('ul', { className: "space-y-4 text-sm text-zinc-500" }, [
                                h('li', { className: "flex items-center gap-2" }, [
                                    h(LucideIcon, { name: 'mail', size: 16 }),
                                    "hello@tktm.shop"
                                ]),
                                h('li', { className: "flex items-center gap-2" }, [
                                    h(LucideIcon, { name: 'phone', size: 16 }),
                                    "+62 889 7326 2022"
                                ])
                            ])
                        ])
                    ]),
                    h('div', { className: "pt-8 border-t border-zinc-900 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-zinc-600 font-medium" }, [
                        h('p', {}, `© ${new Date().getFullYear()} ${CONFIG.brandName}. Hak Cipta Dilindungi.`),
                        h('div', { className: "flex gap-6" }, [
                            h('a', { href: "#", className: "hover:text-white" }, "Kebijakan Privasi"),
                            h('a', { href: "#", className: "hover:text-white" }, "Syarat & Ketentuan")
                        ])
                    ])
                ])
            ]);
        };

        // Component: App
        const App = () => {
            const [searchQuery, setSearchQuery] = useState('');
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [toast, setToast] = useState({ message: '', visible: false });

            const showToast = (message) => {
                setToast({ message, visible: true });
                setTimeout(() => setToast({ message: '', visible: false }), 3000);
            };

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
                showToast(`${product.name} ditambahkan ke keranjang`);
            };

            const updateQuantity = (id, q) => {
                if (q < 1) return;
                setCart(prev => prev.map(item => item.id === id ? { ...item, quantity: q } : item));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const generateWhatsAppLink = (items) => {
                const baseUrl = `https://wa.me/${CONFIG.whatsappNumber}`;
                const text = encodeURIComponent(
                    `Halo ${CONFIG.brandName}, saya ingin memesan:\n\n` +
                    items.map(i => `- ${i.name} (x${i.quantity}) - ${formatPrice(i.price * i.quantity)}`).join('\n') +
                    `\n\nTotal: ${formatPrice(items.reduce((sum, i) => sum + (i.price * i.quantity), 0))}`
                );
                return `${baseUrl}?text=${text}`;
            };

            const handleCheckout = () => {
                window.open(generateWhatsAppLink(cart), '_blank');
                setCart([]);
                setIsCartOpen(false);
                showToast("Pembelian berhasil");
            };

            const handleBuyNow = (product) => {
                window.open(generateWhatsAppLink([{ ...product, quantity: 1 }]), '_blank');
                showToast("Membuka WhatsApp...");
            };

            const filteredProducts = useMemo(() =>
                PRODUCTS.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase())),
                [searchQuery]
            );

            return h('div', { className: "min-h-screen" }, [
                h(Navbar, {
                    cartCount: cart.reduce((sum, i) => sum + i.quantity, 0),
                    onOpenCart: () => setIsCartOpen(true),
                    onSearch: setSearchQuery,
                    searchQuery
                }),
                h('main', {}, [
                    h(Hero),
                    h(ProductGrid, {
                        products: filteredProducts,
                        onOpenDetails: setSelectedProduct,
                        onAddToCart: addToCart,
                        onBuyNow: handleBuyNow
                    })
                ]),
                h(Footer),
                h(CartDrawer, {
                    isOpen: isCartOpen,
                    onClose: () => setIsCartOpen(false),
                    cart,
                    onRemove: removeFromCart,
                    onUpdateQuantity: updateQuantity,
                    onCheckout: handleCheckout
                }),
                h(ProductModal, {
                    product: selectedProduct,
                    isOpen: !!selectedProduct,
                    onClose: () => setSelectedProduct(null),
                    onAddToCart: addToCart,
                    onBuyNow: handleBuyNow
                }),
                h(Toast, { ...toast })
            ]);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>
</html>
