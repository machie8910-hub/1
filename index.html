<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKTM - Toko Koleksi Terlengkap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://unpkg.com/lucide@0.294.0/dist/umd/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#e11d48',
                            dark: '#be123c',
                            light: '#fb7185',
                        },
                        dark: {
                            DEFAULT: '#0a0a0a',
                            soft: '#171717',
                            card: '#1f1f1f',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'slide-left': 'slide-left 0.3s ease-out',
                        'slide-right': 'slide-right 0.3s ease-out',
                        'fade-in': 'fade-in 0.4s ease-out',
                    },
                    keyframes: {
                        'slide-left': {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' },
                        },
                        'slide-right': {
                            '0%': { transform: 'translateX(-100%)' },
                            '100%': { transform: 'translateX(0)' },
                        },
                        'fade-in': {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-dark text-white selection:bg-brand selection:text-white;
            }
            ::-webkit-scrollbar {
                @apply w-1.5;
            }
            ::-webkit-scrollbar-track {
                @apply bg-dark;
            }
            ::-webkit-scrollbar-thumb {
                @apply bg-zinc-800 hover:bg-zinc-700 transition-colors rounded-full;
            }
        }
        @layer components {
            .btn-primary {
                @apply bg-brand hover:bg-brand-dark text-white font-bold py-3 px-6 rounded-full transition-all duration-300 transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2;
            }
            .btn-outline {
                @apply border-2 border-white/10 hover:border-brand hover:text-brand text-white font-bold py-3 px-6 rounded-full transition-all duration-300 flex items-center justify-center gap-2;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/javascript">
        const { useState, useEffect, useMemo, createElement: h } = React;

        const CONFIG = {
            brandName: 'TKTM',
            whatsappNumber: '6288973262022',
            currency: 'IDR',
            products: [
                {
                    id: 1,
                    name: 'Stealth Bomber Jacket',
                    price: 1250000,
                    category: 'Apparel',
                    images: [
                        'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?q=80&w=800&auto=format&fit=crop',
                        'https://images.unsplash.com/photo-1551028719-00167b16eac5?q=80&w=800&auto=format&fit=crop'
                    ],
                    description: 'Jaket bomber dengan material high-performance, tahan air, dan desain futuristik. Cocok untuk tampilan urban streetwear yang bold.'
                },
                {
                    id: 2,
                    name: 'Oversized "Zenith" Tee',
                    price: 350000,
                    category: 'Apparel',
                    images: [
                        'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=800&auto=format&fit=crop',
                        'https://images.unsplash.com/photo-1562157873-818bc0726f68?q=80&w=800&auto=format&fit=crop'
                    ],
                    description: 'Kaos oversized dengan bahan katun premium 24s. Menampilkan desain tipografi minimalis yang terinspirasi dari estetika Tokyo modern.'
                },
                {
                    id: 3,
                    name: 'Cargo Tech-Pants X1',
                    price: 850000,
                    category: 'Apparel',
                    images: [
                        'https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?q=80&w=800&auto=format&fit=crop',
                        'https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?q=80&w=800&auto=format&fit=crop'
                    ],
                    description: 'Celana cargo dengan banyak kompartemen fungsional. Menggunakan bahan stretch ripstop yang nyaman untuk mobilitas tinggi.'
                },
                {
                    id: 4,
                    name: 'Neon Runner Sneakers',
                    price: 1750000,
                    category: 'Footwear',
                    images: [
                        'https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=800&auto=format&fit=crop',
                        'https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800&auto=format&fit=crop'
                    ],
                    description: 'Sneakers dengan teknologi cushioning terbaru dan aksen reflektif. Memberikan kenyamanan maksimal dan gaya yang stand out.'
                },
                {
                    id: 5,
                    name: 'Tactical Utility Vest',
                    price: 650000,
                    category: 'Apparel',
                    images: [
                        'https://images.unsplash.com/photo-1614786482494-7fc57abd0074?q=80&w=800&auto=format&fit=crop',
                        'https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?q=80&w=800&auto=format&fit=crop'
                    ],
                    description: 'Vest taktis dengan sistem modular. Memberikan lapisan tambahan untuk gaya techwear Anda dengan fungsionalitas ekstra.'
                },
                {
                    id: 6,
                    name: 'Urban Explorer Backpack',
                    price: 950000,
                    category: 'Accessories',
                    images: [
                        'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?q=80&w=800&auto=format&fit=crop',
                        'https://images.unsplash.com/photo-1547949003-9792a18a2601?q=80&w=800&auto=format&fit=crop'
                    ],
                    description: 'Tas punggung tahan cuaca dengan kapasitas besar dan kompartemen laptop terproteksi. Desain sleek untuk penggunaan harian.'
                }
            ]
        };

        const LucideIcon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                const timer = setTimeout(() => {
                    if (window.lucide) {
                        window.lucide.createIcons({
                            nameAttr: 'data-lucide'
                        });
                    }
                }, 0);
                return () => clearTimeout(timer);
            }, [name]);

            return h('i', {
                'data-lucide': name,
                className: className,
                style: { width: size, height: size }
            });
        };

        const Navbar = ({ cartCount, onOpenCart }) => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return h('nav', {
                className: `fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${isScrolled ? 'bg-dark/80 backdrop-blur-md py-4' : 'bg-transparent py-6'}`
            },
                h('div', { className: 'container mx-auto px-6 flex justify-between items-center' },
                    h('a', { href: '#', className: 'text-2xl font-black tracking-tighter text-white flex items-center gap-2' },
                        h('span', { className: 'bg-brand px-2 py-0.5 rounded' }, 'T'),
                        h('span', null, 'KTM')
                    ),
                    h('div', { className: 'flex items-center gap-8' },
                        h('div', { className: 'hidden md:flex items-center gap-8 text-sm font-medium uppercase tracking-widest' },
                            h('a', { href: '#koleksi', className: 'hover:text-brand transition-colors' }, 'Koleksi'),
                            h('a', { href: '#terbaru', className: 'hover:text-brand transition-colors' }, 'Terbaru'),
                            h('a', { href: '#kontak', className: 'hover:text-brand transition-colors' }, 'Kontak')
                        ),
                        h('button', {
                            onClick: onOpenCart,
                            className: 'relative p-2 hover:bg-white/10 rounded-full transition-colors',
                            'aria-label': 'Keranjang'
                        },
                            h(LucideIcon, { name: 'shopping-cart' }),
                            cartCount > 0 && h('span', {
                                className: 'absolute -top-1 -right-1 bg-brand text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full'
                            }, cartCount)
                        )
                    )
                )
            );
        };

        const Hero = () => {
            return h('section', { className: 'relative h-screen flex items-center justify-center overflow-hidden' },
                h('div', { className: 'absolute inset-0 z-0' },
                    h('img', {
                        src: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2000&auto=format&fit=crop',
                        className: 'w-full h-full object-cover opacity-40 grayscale',
                        alt: 'Hero background'
                    }),
                    h('div', { className: 'absolute inset-0 bg-gradient-to-t from-dark via-dark/50 to-transparent' })
                ),
                h('div', { className: 'container mx-auto px-6 relative z-10 text-center' },
                    h('h2', { className: 'text-brand font-bold tracking-[0.5em] uppercase mb-4 animate-fade-in' }, 'The Future of Style'),
                    h('h1', { className: 'text-6xl md:text-8xl font-black mb-8 leading-none tracking-tighter animate-fade-in' },
                        'ELEVATE YOUR', h('br'), 'AESTHETIC'
                    ),
                    h('p', { className: 'text-zinc-400 max-w-xl mx-auto mb-10 text-lg' },
                        'Koleksi eksklusif streetwear dengan sentuhan futuristik dan material premium. Didesain untuk mereka yang berani tampil beda.'
                    ),
                    h('div', { className: 'flex flex-col sm:flex-row gap-4 justify-center items-center' },
                        h('a', { href: '#koleksi', className: 'btn-primary w-full sm:w-auto px-10' },
                            'Belanja Sekarang',
                            h(LucideIcon, { name: 'arrow-right', size: 20 })
                        ),
                        h('a', { href: '#terbaru', className: 'btn-outline w-full sm:w-auto px-10' }, 'Lihat Katalog')
                    )
                )
            );
        };

        const ProductCard = ({ product, onSelect }) => {
            return h('div', {
                className: 'group cursor-pointer'
            },
                h('div', {
                    onClick: () => onSelect(product),
                    className: 'relative aspect-[3/4] overflow-hidden rounded-2xl bg-dark-card mb-4'
                },
                    h('img', {
                        src: product.images[0],
                        alt: product.name,
                        className: 'w-full h-full object-cover transition-transform duration-700 group-hover:scale-110'
                    }),
                    h('div', { className: 'absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-3' },
                        h('div', { className: 'bg-white text-dark p-3 rounded-full' }, h(LucideIcon, { name: 'eye' })),
                    )
                ),
                h('div', { className: 'flex justify-between items-start' },
                    h('div', null,
                        h('p', { className: 'text-zinc-500 text-xs uppercase tracking-widest mb-1' }, product.category),
                        h('h3', { className: 'font-bold text-lg group-hover:text-brand transition-colors' }, product.name),
                        h('p', { className: 'text-brand font-medium' }, `Rp ${product.price.toLocaleString('id-ID')}`)
                    )
                )
            );
        };

        const ProductModal = ({ product, onClose, onAddToCart }) => {
            if (!product) return null;

            const [activeImage, setActiveImage] = useState(0);

            return h('div', { className: 'fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-10' },
                h('div', { className: 'absolute inset-0 bg-dark/95 backdrop-blur-xl', onClick: onClose }),
                h('div', { className: 'relative bg-dark-card w-full max-w-5xl rounded-3xl overflow-hidden flex flex-col md:flex-row max-h-full animate-fade-in border border-white/5 shadow-2xl' },
                    h('button', {
                        onClick: onClose,
                        className: 'absolute top-6 right-6 z-10 p-2 bg-black/50 hover:bg-brand text-white rounded-full transition-colors'
                    }, h(LucideIcon, { name: 'x' })),

                    // Left: Images
                    h('div', { className: 'w-full md:w-3/5 p-6 md:p-10 flex flex-col gap-6' },
                        h('div', { className: 'aspect-square md:aspect-auto md:h-[500px] rounded-2xl overflow-hidden bg-dark' },
                            h('img', {
                                src: product.images[activeImage],
                                className: 'w-full h-full object-cover',
                                alt: product.name
                            })
                        ),
                        h('div', { className: 'flex gap-4' },
                            product.images.map((img, idx) =>
                                h('button', {
                                    key: idx,
                                    onClick: () => setActiveImage(idx),
                                    className: `w-20 h-20 rounded-xl overflow-hidden border-2 transition-all ${activeImage === idx ? 'border-brand scale-105' : 'border-transparent opacity-50 hover:opacity-100'}`
                                },
                                    h('img', { src: img, className: 'w-full h-full object-cover' })
                                )
                            )
                        )
                    ),

                    // Right: Details
                    h('div', { className: 'w-full md:w-2/5 p-8 md:p-10 bg-zinc-900/50 flex flex-col justify-center' },
                        h('p', { className: 'text-brand font-bold uppercase tracking-[0.2em] text-sm mb-2' }, product.category),
                        h('h2', { className: 'text-3xl md:text-4xl font-black mb-4' }, product.name),
                        h('p', { className: 'text-2xl text-white font-medium mb-8' }, `Rp ${product.price.toLocaleString('id-ID')}`),
                        h('p', { className: 'text-zinc-400 mb-10 leading-relaxed' }, product.description),

                        h('div', { className: 'space-y-4' },
                            h('button', {
                                onClick: () => {
                                    onAddToCart(product);
                                    onClose();
                                },
                                className: 'btn-primary w-full py-4 text-lg'
                            },
                                h(LucideIcon, { name: 'shopping-cart' }),
                                'Tambah ke Keranjang'
                            ),
                            h('button', {
                                onClick: () => {
                                    const message = encodeURIComponent(`Halo TKTM, saya ingin beli ${product.name} - Rp ${product.price.toLocaleString('id-ID')}`);
                                    window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${message}`, '_blank');
                                },
                                className: 'btn-outline w-full py-4'
                            }, 'Beli Sekarang')
                        )
                    )
                )
            );
        };

        const CartDrawer = ({ isOpen, onClose, cartItems, onUpdateQty, onRemove }) => {
            const total = useMemo(() => cartItems.reduce((acc, item) => acc + (item.price * item.quantity), 0), [cartItems]);

            const handleCheckout = () => {
                if (cartItems.length === 0) return;
                let message = `Halo TKTM, saya ingin memesan:\n\n`;
                cartItems.forEach((item, index) => {
                    message += `${index + 1}. ${item.name} (${item.quantity}x) - Rp ${(item.price * item.quantity).toLocaleString('id-ID')}\n`;
                });
                message += `\nTotal: Rp ${total.toLocaleString('id-ID')}`;
                window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
            };

            return h('div', {
                className: `fixed inset-0 z-[120] transition-opacity duration-300 ${isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`
            },
                h('div', { className: 'absolute inset-0 bg-black/80 backdrop-blur-sm', onClick: onClose }),
                h('div', {
                    className: `absolute top-0 right-0 h-full w-full max-w-md bg-dark border-l border-white/5 shadow-2xl flex flex-col transition-transform duration-300 ${isOpen ? 'translate-x-0' : 'translate-x-full'}`
                },
                    h('div', { className: 'p-6 border-b border-white/5 flex justify-between items-center' },
                        h('h2', { className: 'text-xl font-black uppercase tracking-widest' }, 'Keranjang'),
                        h('button', { onClick: onClose, className: 'p-2 hover:bg-white/10 rounded-full' }, h(LucideIcon, { name: 'x' }))
                    ),

                    h('div', { className: 'flex-1 overflow-y-auto p-6 space-y-6' },
                        cartItems.length === 0 ?
                            h('div', { className: 'h-full flex flex-col items-center justify-center text-zinc-500' },
                                h(LucideIcon, { name: 'shopping-bag', size: 64, className: 'mb-4 opacity-20' }),
                                h('p', null, 'Keranjang Anda masih kosong.')
                            ) :
                            cartItems.map(item => h('div', { key: item.id, className: 'flex gap-4' },
                                h('div', { className: 'w-20 h-24 bg-zinc-900 rounded-lg overflow-hidden flex-shrink-0' },
                                    h('img', { src: item.images[0], className: 'w-full h-full object-cover' })
                                ),
                                h('div', { className: 'flex-1 flex flex-col justify-between' },
                                    h('div', null,
                                        h('h4', { className: 'font-bold' }, item.name),
                                        h('p', { className: 'text-brand text-sm' }, `Rp ${item.price.toLocaleString('id-ID')}`)
                                    ),
                                    h('div', { className: 'flex items-center justify-between' },
                                        h('div', { className: 'flex items-center gap-3 bg-zinc-900 rounded-full px-2 py-1' },
                                            h('button', {
                                                onClick: () => onUpdateQty(item.id, item.quantity - 1),
                                                className: 'w-6 h-6 flex items-center justify-center hover:text-brand'
                                            }, '-'),
                                            h('span', { className: 'text-sm font-bold w-4 text-center' }, item.quantity),
                                            h('button', {
                                                onClick: () => onUpdateQty(item.id, item.quantity + 1),
                                                className: 'w-6 h-6 flex items-center justify-center hover:text-brand'
                                            }, '+')
                                        ),
                                        h('button', {
                                            onClick: () => onRemove(item.id),
                                            className: 'text-zinc-500 hover:text-brand transition-colors'
                                        }, h(LucideIcon, { name: 'trash-2', size: 18 }))
                                    )
                                )
                            ))
                    ),

                    h('div', { className: 'p-6 border-t border-white/5 bg-zinc-900/50' },
                        h('div', { className: 'flex justify-between items-center mb-6' },
                            h('span', { className: 'text-zinc-400 uppercase tracking-widest text-sm' }, 'Total'),
                            h('span', { className: 'text-2xl font-black' }, `Rp ${total.toLocaleString('id-ID')}`)
                        ),
                        h('button', {
                            onClick: handleCheckout,
                            disabled: cartItems.length === 0,
                            className: 'btn-primary w-full py-4 text-lg'
                        }, 'Checkout via WhatsApp')
                    )
                )
            );
        };

        const App = () => {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [toast, setToast] = useState(null);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    }
                    return [...prev, { ...product, quantity: 1 }];
                });
                showToast(`Berhasil menambahkan ${product.name}`);
            };

            const updateQty = (id, qty) => {
                if (qty < 1) {
                    removeFromCart(id);
                    return;
                }
                setCart(prev => prev.map(item => item.id === id ? { ...item, quantity: qty } : item));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const cartCount = useMemo(() => cart.reduce((acc, item) => acc + item.quantity, 0), [cart]);

            return h('div', { className: 'min-h-screen relative' },
                h(Navbar, { cartCount, onOpenCart: () => setIsCartOpen(true) }),
                h(Hero),

                h('section', { id: 'koleksi', className: 'py-24 bg-dark' },
                    h('div', { className: 'container mx-auto px-6' },
                        h('div', { className: 'flex flex-col md:flex-row justify-between items-end mb-16 gap-4' },
                            h('div', null,
                                h('h2', { className: 'text-brand font-bold tracking-[0.3em] uppercase mb-2' }, 'Katalog Koleksi'),
                                h('h3', { className: 'text-5xl font-black tracking-tighter' }, 'OUR LATEST DROPS')
                            ),
                            h('div', { className: 'text-zinc-500 text-sm font-medium uppercase tracking-[0.2em]' },
                                'Menampilkan ', CONFIG.products.length, ' Produk'
                            )
                        ),
                        h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-8 gap-y-16' },
                            CONFIG.products.map(product =>
                                h(ProductCard, { key: product.id, product, onSelect: setSelectedProduct })
                            )
                        )
                    )
                ),

                h('footer', { id: 'kontak', className: 'py-20 border-t border-white/5 bg-zinc-950' },
                    h('div', { className: 'container mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-16' },
                        h('div', { className: 'space-y-6' },
                            h('div', { className: 'text-3xl font-black tracking-tighter flex items-center gap-2' },
                                h('span', { className: 'bg-brand px-2 py-0.5 rounded' }, 'T'),
                                h('span', null, 'KTM')
                            ),
                            h('p', { className: 'text-zinc-400' }, 'Toko Koleksi Terlengkap untuk kebutuhan gaya hidup modern dan futuristik Anda.')
                        ),
                        h('div', null,
                            h('h4', { className: 'font-bold uppercase tracking-widest mb-6' }, 'Navigasi'),
                            h('ul', { className: 'space-y-4 text-zinc-400' },
                                h('li', null, h('a', { href: '#', className: 'hover:text-brand transition-colors' }, 'Beranda')),
                                h('li', null, h('a', { href: '#koleksi', className: 'hover:text-brand transition-colors' }, 'Koleksi')),
                                h('li', null, h('a', { href: '#terbaru', className: 'hover:text-brand transition-colors' }, 'Katalog')),
                                h('li', null, h('a', { href: '#kontak', className: 'hover:text-brand transition-colors' }, 'Kontak'))
                            )
                        ),
                        h('div', null,
                            h('h4', { className: 'font-bold uppercase tracking-widest mb-6' }, 'Hubungi Kami'),
                            h('div', { className: 'space-y-4 text-zinc-400' },
                                h('div', { className: 'flex items-center gap-3' },
                                    h(LucideIcon, { name: 'phone', size: 20 }),
                                    h('p', null, CONFIG.whatsappNumber)
                                ),
                                h('div', { className: 'flex items-center gap-3' },
                                    h(LucideIcon, { name: 'mail', size: 20 }),
                                    h('p', null, 'hello@tktm.shop')
                                ),
                                h('div', { className: 'flex items-center gap-3' },
                                    h(LucideIcon, { name: 'map-pin', size: 20 }),
                                    h('p', null, 'Distrik Shibuya Baru, Jakarta Selatan')
                                )
                            )
                        )
                    ),
                    h('div', { className: 'container mx-auto px-6 mt-20 pt-8 border-t border-white/5 text-center text-zinc-500 text-sm' },
                        '© ', new Date().getFullYear(), ' TKTM - Toko Koleksi Terlengkap. All Rights Reserved.'
                    )
                ),

                h(ProductModal, {
                    product: selectedProduct,
                    onClose: () => setSelectedProduct(null),
                    onAddToCart: addToCart
                }),

                h(CartDrawer, {
                    isOpen: isCartOpen,
                    onClose: () => setIsCartOpen(false),
                    cartItems: cart,
                    onUpdateQty: updateQty,
                    onRemove: removeFromCart
                }),

                toast && h('div', {
                    className: 'fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] bg-white text-[#0a0a0a] px-8 py-4 rounded-full font-bold shadow-2xl animate-fade-in flex items-center gap-3'
                },
                    h(LucideIcon, { name: 'check-circle-2', className: 'text-green-500' }),
                    toast
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>
</html>
